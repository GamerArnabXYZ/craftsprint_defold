name: CraftSprint.io Build (WebGL & APK)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Defold bob.jar
        run: |
          mkdir -p tools
          curl -L -o tools/bob.jar https://github.com/defold/defold/releases/download/1.9.0/bob.jar

      - name: Resolve and Build
        run: |
          java -jar tools/bob.jar --archive -p js-web --settings game.project resolve distclean build

      - name: Bundle WebGL
        run: |
          java -jar tools/bob.jar --archive -p js-web --settings game.project bundle --bundle-output build/web