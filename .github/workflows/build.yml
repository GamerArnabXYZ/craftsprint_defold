name: CraftSprint.io Build (WebGL & APK)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Defold bob.jar
        run: |
          mkdir -p tools
          curl -L -o tools/bob.jar https://github.com/defold/defold/releases/download/1.9.0/bob.jar

      # Magic Fix: Resolve -> Build -> Bundle in proper sequence with --root .
      - name: Resolve Dependencies
        run: java -jar tools/bob.jar --root . --settings game.project -p js-web resolve

      - name: Compile and Archive
        run: java -jar tools/bob.jar --root . --settings game.project -p js-web --archive build

      - name: Bundle WebGL App
        run: java -jar tools/bob.jar --root . --settings game.project -p js-web --archive bundle --bundle-output build/web

      - name: Upload WebGL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CraftSprint-WebGL
          path: build/web/
